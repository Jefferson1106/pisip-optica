<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Perfect Vision - Cambiar contraseña</title>
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-primary">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-7 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-5">
                    <div class="text-center">
                        <h1 class="h4 text-gray-900 mb-3">Cambio obligatorio de contraseña</h1>
                        <p class="text-muted mb-4">Por seguridad, debes reemplazar la contraseña temporal antes de continuar.</p>
                    </div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form th:action="@{/cambiar-contrasenia}" method="post" th:object="${cambioContrasenia}">
                        <div class="form-group">
                            <label for="nuevaContrasenia">Nueva contraseña</label>
                            <input type="password" class="form-control" id="nuevaContrasenia"
                                   th:field="*{nuevaContrasenia}" autocomplete="new-password" required>
                            <small class="form-text text-muted">Mínimo 8 caracteres, con mayúscula, minúscula, número y carácter especial.</small>
                            <small th:if="${#fields.hasErrors('nuevaContrasenia')}" class="text-danger"
                                   th:errors="*{nuevaContrasenia}"></small>
                        </div>
                        <div class="form-group">
                            <label for="confirmarContrasenia">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="confirmarContrasenia"
                                   th:field="*{confirmarContrasenia}" autocomplete="new-password" required>
                            <small th:if="${#fields.hasErrors('confirmarContrasenia')}" class="text-danger"
                                   th:errors="*{confirmarContrasenia}"></small>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Cambiar contraseña y continuar</button>
                    </form>
                    <form th:action="@{/logout}" method="post" class="mt-3 text-center">
                        <button type="submit" class="btn btn-link">Cerrar sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
