<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">
<head>
    <meta charset="UTF-8">
    <title>Perfect Vision - Detalles de Examen</title>
</head>
<body>
<div layout:fragment="contenidopaginas">
    <div class="container-fluid">
        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h5 class="m-0 font-weight-bold text-primary"
                    th:text="${'Detalles del Examen #'+idExamen}">Detalles del Examen</h5>
                <div>
                    <a th:href="@{/examenes-visuales/{idExamen}/detalles/nuevo(idExamen=${idExamen})}" class="btn btn-success btn-sm">Nuevo Detalle</a>
                    <a th:href="@{/examenes-visuales}" class="btn btn-secondary btn-sm">Volver a Examenes</a>
                </div>
            </div>
            <div class="card-body">
                <div th:if="${success}" class="alert alert-success" role="alert">
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}"></span>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered" width="100%" cellspacing="0">
                        <thead>
                        <tr>
                            <th>ID Detalle</th>
                            <th>Esfera Dist. OD</th>
                            <th>Cilindro Dist. OD</th>
                            <th>Eje Dist. OD</th>
                            <th>Esfera Dist. OI</th>
                            <th>Cilindro Dist. OI</th>
                            <th>Eje Dist. OI</th>
                            <th>Adicion OD</th>
                            <th>Adicion OI</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(listadetalles)}">
                            <td colspan="10" class="text-center">No existen detalles para este examen.</td>
                        </tr>
                        <tr th:each="detalle : ${listadetalles}">
                            <td th:text="${detalle.idDetExamen}"></td>
                            <td th:text="${detalle.esferaDistanciaOd}"></td>
                            <td th:text="${detalle.cilindroDistanciaOd}"></td>
                            <td th:text="${detalle.ejeDistanciaOd}"></td>
                            <td th:text="${detalle.esferaDistanciaOi}"></td>
                            <td th:text="${detalle.cilindroDistanciaOi}"></td>
                            <td th:text="${detalle.ejeDistanciaOi}"></td>
                            <td th:text="${detalle.adicionOd}"></td>
                            <td th:text="${detalle.adicionOi}"></td>
                            <td>
                                <a th:href="@{/examenes-visuales/{idExamen}/detalles/editar/{idDetExamen}(idExamen=${idExamen},idDetExamen=${detalle.idDetExamen})}"
                                              class="btn btn-warning btn-sm mr-1"
                                              title="Editar"
                                              aria-label="Editar"><i class="fas fa-edit"></i></a>
                                <a th:href="@{/examenes-visuales/{idExamen}/detalles/eliminar/{idDetExamen}(idExamen=${idExamen},idDetExamen=${detalle.idDetExamen})}"
                                   class="btn btn-danger btn-sm"
                                              title="Eliminar"
                                              aria-label="Eliminar"
                                              onclick="return confirm('¿Desea eliminar este detalle de examen?');"><i class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
