<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Perfect Vision - Catalogos</title>
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
    <link href="/vendor/datatables/dataTables.bootstrap4.min.css" rel="stylesheet">
    <link href="/css/tablas-ajustadas.css" rel="stylesheet">
</head>
<body id="page-top">
    <div id="wrapper">
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="/catalogo">
                <div class="sidebar-brand-icon rotate-n-15">
                    <i class="fas fa-glasses"></i>
                </div>
                <div class="sidebar-brand-text mx-3">Perfect Vision</div>
            </a>

            <hr class="sidebar-divider my-0">

            <div class="sidebar-heading"
                 th:if="${session.usuarioSesion != null and session.usuarioSesion.tipoUsuarioNombre != null and #strings.containsIgnoreCase(session.usuarioSesion.tipoUsuarioNombre, 'admin')}">Administracion</div>
            <li class="nav-item active"
                th:if="${session.usuarioSesion != null and session.usuarioSesion.tipoUsuarioNombre != null and #strings.containsIgnoreCase(session.usuarioSesion.tipoUsuarioNombre, 'admin')}">
                <a class="nav-link" href="/catalogo"><i class="fas fa-fw fa-book"></i><span>Catalogos</span></a>
            </li>
            <li class="nav-item"
                th:if="${session.usuarioSesion != null and session.usuarioSesion.tipoUsuarioNombre != null and #strings.containsIgnoreCase(session.usuarioSesion.tipoUsuarioNombre, 'admin')}">
                <a class="nav-link" href="/detalle-catalogo"><i class="fas fa-fw fa-list"></i><span>Detalle Catalogo</span></a>
            </li>
            <li class="nav-item"
                th:if="${session.usuarioSesion != null and session.usuarioSesion.tipoUsuarioNombre != null and #strings.containsIgnoreCase(session.usuarioSesion.tipoUsuarioNombre, 'admin')}">
                <a class="nav-link" href="/usuarios"><i class="fas fa-fw fa-users"></i><span>Usuarios</span></a>
            </li>
            <li class="nav-item"
                th:if="${session.usuarioSesion != null and session.usuarioSesion.tipoUsuarioNombre != null and #strings.containsIgnoreCase(session.usuarioSesion.tipoUsuarioNombre, 'admin')}">
                <a class="nav-link" href="/proveedores"><i class="fas fa-fw fa-truck-loading"></i><span>Proveedores</span></a>
            </li>
            <li class="nav-item"
                th:if="${session.usuarioSesion != null and session.usuarioSesion.tipoUsuarioNombre != null and #strings.containsIgnoreCase(session.usuarioSesion.tipoUsuarioNombre, 'admin')}">
                <a class="nav-link" href="/productos"><i class="fas fa-fw fa-box"></i><span>Productos</span></a>
            </li>

            <hr class="sidebar-divider">

            <div class="sidebar-heading">Gestion</div>
            <li class="nav-item">
                <a class="nav-link" href="/paciente"><i class="fas fa-fw fa-user-injured"></i><span>Pacientes</span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/examenes-visuales"><i class="fas fa-fw fa-eye"></i><span>Examenes Visuales</span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/ordenespedido"><i class="fas fa-fw fa-shopping-cart"></i><span>Ordenes de Pedido</span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/ordenes-entrega"><i class="fas fa-fw fa-truck"></i><span>Ordenes de Entrega</span></a>
            </li>

            <hr class="sidebar-divider">

            <div class="sidebar-heading">Reportes</div>
            <li class="nav-item">
                <a class="nav-link" href="/certificados"><i class="fas fa-fw fa-file-medical"></i><span>Certificados</span></a>
            </li>

            <hr class="sidebar-divider d-none d-md-block">

            <div class="text-center d-none d-md-inline">
                <button class="rounded-circle border-0" id="sidebarToggle"></button>
            </div>
        </ul>

        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                        <i class="fa fa-bars"></i>
                    </button>
                    <h1 class="h5 mb-0 text-gray-800"></h1>
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item d-flex flex-column align-items-end mr-3 text-gray-600 small"
                            th:if="${session.usuarioSesion != null}">
                            <span th:text="${session.usuarioSesion.nombres + ' ' + session.usuarioSesion.apellidos}"></span>
                            <span class="text-xs"
                                  th:if="${session.inicioSesion != null}"
                                  th:text="${'Inicio: ' + session.inicioSesion}"></span>
                                <span class="text-xs"
                                    th:if="${session.ultimaActividad != null}"
                                    th:text="${'Ultima actividad: ' + session.ultimaActividad}"></span>
                        </li>
                        <li class="nav-item">
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="btn btn-outline-primary btn-sm">Cerrar sesion</button>
                            </form>
                        </li>
                    </ul>
                </nav>

                <div class="container-fluid">
                   
                            <div layout:fragment="contenidopaginas">

                        </div>
            </div>

            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">
                        <span>Copyright &copy; Perfect Vision 2026</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="/js/sb-admin-2.min.js"></script>
    <script src="/vendor/datatables/jquery.dataTables.min.js"></script>
    <script src="/vendor/datatables/dataTables.bootstrap4.min.js"></script>
    <script src="/js/demo/datatables-demo.js"></script>
    <script>
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) {
                window.location.reload();
            }
        });
    </script>
    <div layout:fragment="scripts"></div>
</body>
</html>
