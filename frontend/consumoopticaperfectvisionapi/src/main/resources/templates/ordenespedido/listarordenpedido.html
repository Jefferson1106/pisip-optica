<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">

<head>
	<meta charset="UTF-8">
	<title>Perfect Vision - Ordenes de Pedido</title>
</head>

<body>
	<div layout:fragment="contenidopaginas">
		<div class="container-fluid">
			<div class="card shadow mb-4">
				<div class="card-header py-3 d-flex justify-content-between align-items-center">
					<h5 class="m-0 font-weight-bold text-primary">Perfect Vision - Ordenes de Pedido</h5>
					<a th:href="@{/ordenespedido/nuevo}" class="btn btn-success">Nueva Orden</a>
				</div>
				<div class="card-body">
					<div class="table-responsive">
						<div th:if="${success}" class="alert alert-success" role="alert">
							<span th:text="${success}"></span>
						</div>
						<div th:if="${error}" class="alert alert-danger" role="alert">
							<span th:text="${error}"></span>
						</div>

						<table class="table table-bordered" id="dataTable" data-preservar-orden="true" width="100%" cellspacing="0">
							<thead>
								<tr>
									<th>N°</th>
									<th style="display:none;">ID Pedido</th>
									<th>Nombres</th>
									<th>Apellidos</th>
									<th>Cédula</th>
									<th>Examen</th>
									<th>Estado Pedido</th>
									<th>Fecha Registro</th>
									<th>Fecha Pedido</th>
									<th>Fecha Entrega</th>
									<th>Acciones</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="pedido, iterStat : ${listaordenpedidos}">
									<td th:text="${iterStat.count}"></td>
									<td style="display:none;" th:text="${pedido.idPedido}"></td>
									<td th:text="${nombresPorPaciente[pedido.idPaciente] != null ? nombresPorPaciente[pedido.idPaciente] : '-'}"></td>
									<td th:text="${apellidosPorPaciente[pedido.idPaciente] != null ? apellidosPorPaciente[pedido.idPaciente] : '-'}"></td>
									<td th:text="${cedulasPorPaciente[pedido.idPaciente] != null ? cedulasPorPaciente[pedido.idPaciente] : '-'}"></td>
									<td th:text="${pedido.examenDescripcion}"></td>
									<td th:text="${pedido.nombreEstadoPedido}"></td>
									<td th:text="${pedido.fechaRegistro}"></td>
									<td th:text="${pedido.fechaPedido}"></td>
									<td th:text="${pedido.fechaEntrega}"></td>
									<td>
										<a th:href="@{/ordenespedido/pdf/{id}(id=${pedido.idPedido})}"
										   class="btn btn-primary btn-sm mr-1"
										   title="Descargar PDF"
										   aria-label="Descargar PDF">
											<i class="fas fa-file-pdf"></i>
										</a>
										<th:block th:if="${!pedidosBloqueados.contains(pedido.idPedido)}">
										<a th:href="@{/ordenespedido/editar/{id}(id=${pedido.idPedido})}"
										   class="btn btn-warning btn-sm mr-1"
										   title="Editar"
										   aria-label="Editar">
											<i class="fas fa-edit"></i>
										</a>
										<a th:href="@{/ordenespedido/{id}/detalles(id=${pedido.idPedido})}"
										   class="btn btn-info btn-sm mr-1"
										   title="Ver detalles"
										   aria-label="Ver detalles">
											<i class="fas fa-eye"></i>
										</a>
										<a th:href="@{/ordenes-entrega/nuevo(idPedido=${pedido.idPedido})}"
										   class="btn btn-primary btn-sm mr-1"
										   title="Generar orden de entrega"
										   aria-label="Generar orden de entrega"
										   onclick="return confirm('¿Está seguro de generar la orden de entrega para este pedido?');">
											<i class="fas fa-shopping-cart"></i>
										</a>
										<a th:href="@{/ordenespedido/eliminar/{id}(id=${pedido.idPedido})}"
										   class="btn btn-danger btn-sm"
										   title="Eliminar"
										   aria-label="Eliminar"
										   onclick="return confirm('¿Desea eliminar esta orden de pedido?');"><i class="fas fa-trash"></i></a>
										</th:block>

										<th:block th:if="${pedidosBloqueados.contains(pedido.idPedido)}">
											<a href="#" class="btn btn-warning btn-sm mr-1 disabled"
											   title="Pedido bloqueado porque la entrega ya fue recibida"
											   aria-label="Editar bloqueado" onclick="return false;"><i class="fas fa-edit"></i></a>
											<a href="#" class="btn btn-info btn-sm mr-1 disabled"
											   title="Pedido bloqueado porque la entrega ya fue recibida"
											   aria-label="Detalles bloqueados" onclick="return false;"><i class="fas fa-eye"></i></a>
											<a href="#" class="btn btn-primary btn-sm mr-1 disabled"
											   title="Pedido bloqueado porque la entrega ya fue recibida"
											   aria-label="Generar entrega bloqueado" onclick="return false;"><i class="fas fa-shopping-cart"></i></a>
											<a href="#" class="btn btn-danger btn-sm disabled"
											   title="Pedido bloqueado porque la entrega ya fue recibida"
											   aria-label="Eliminar bloqueado" onclick="return false;"><i class="fas fa-trash"></i></a>
										</th:block>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
