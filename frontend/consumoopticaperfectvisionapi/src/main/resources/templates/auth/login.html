<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Perfect Vision - Iniciar Sesion</title>

    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <style>
        .login-brand-panel {
            align-items: center;
            background: linear-gradient(145deg, #eef8ff 0%, #fff 58%, #fff5e7 100%);
            display: flex;
            justify-content: center;
            min-height: 560px;
            padding: 2rem;
        }
        .login-brand-panel img { height: auto; max-width: 100%; }
        .login-logo-mobile { display: none; margin: 0 auto 1.5rem; max-width: 260px; width: 80%; }
        @media (max-width: 991.98px) {
            .login-logo-mobile { display: block; }
        }
    </style>
</head>
<body class="bg-gradient-primary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-10 col-lg-12 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="row">
                            <div class="col-lg-6 d-none d-lg-flex login-brand-panel">
                                <img th:src="@{/img/perfect-vision-logo.png}" alt="Perfect Vision">
                            </div>
                            <div class="col-lg-6">
                                <div class="p-5">
                                    <div class="text-center">
                                        <img class="login-logo-mobile" th:src="@{/img/perfect-vision-logo.png}" alt="Perfect Vision">
                                        <h1 class="h4 text-gray-900 mb-4">Bienvenido a Perfect Vision</h1>
                                    </div>

                                    <div th:if="${info}" class="alert alert-info" role="alert" th:text="${info}"></div>
                                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                                    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>

                                    <form class="user" th:action="@{/login}" method="post" th:object="${credenciales}">
                                        <div class="form-group">
                                            <input type="email" class="form-control form-control-user" th:field="*{correo}" placeholder="Correo" required>
                                            <small th:if="${#fields.hasErrors('correo')}" class="text-danger" th:errors="*{correo}"></small>
                                        </div>
                                        <div class="form-group">
                                            <input type="password" class="form-control form-control-user" th:field="*{contrasenia}" placeholder="Contrasenia" required>
                                            <small th:if="${#fields.hasErrors('contrasenia')}" class="text-danger" th:errors="*{contrasenia}"></small>
                                        </div>
                                        <button type="submit" class="btn btn-primary btn-user btn-block">
                                            Ingresar
                                        </button>
                                    </form>

                                    <div th:if="${usuarioBloqueado}" class="alert alert-warning mt-3" role="alert">
                                        Usuario bloqueado. Para desbloquearlo, recupera la contrasenia.
                                        <a class="btn btn-warning btn-user btn-block mt-2"
                                           th:href="@{/recuperar-contrasenia(correo=${correoBloqueado})}">Desbloquear usuario</a>
                                    </div>

                                    <hr>
                                    <div class="text-center">
                                        <a class="small" th:href="@{/recuperar-contrasenia}">Olvide mi contrasenia</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
</body>
</html>
