<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">

<head>
<meta charset="UTF-8">
<title th:text="${modoEdicion} ? 'Actualizar Paciente - Perfect Vision' : 'Nuevo Paciente - Perfect Vision'">Paciente - Perfect Vision</title>
</head>

<body>
	<div layout:fragment="contenidopaginas">
		<div class="container-fluid">
			<div class="card shadow mb-4">
				<div class="card-header py-3">
					<h5 class="m-0 font-weight-bold text-primary"
						th:text="${modoEdicion} ? 'Actualizar Datos del Paciente' : 'Registrar Nuevo Paciente'">Registrar Nuevo Paciente</h5>
				</div>
				<div class="card-body">

					<!-- Mensaje de error desde el backend -->
					<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

					<form th:action="${modoEdicion} ? @{/paciente/actualizar} : @{/paciente/guardar}" th:object="${paciente}"
						method="post">
						<div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">Revise los campos del formulario.</div>

						<input type="hidden" th:field="*{idPaciente}" />
						<input type="hidden" th:if="${modoEdicion}" th:field="*{idUsuarioRegistro}" />
						<input type="hidden" th:if="${modoEdicion}" th:field="*{fechaRegistro}" />

						<div class="form-group">
							<label for="cedula">Cédula</label> <input type="text"
								th:field="*{cedula}" class="form-control" id="cedula" th:readonly="${modoEdicion}" required
								maxlength="10" pattern="[0-9]{10}"
								title="La cédula debe tener exactamente 10 dígitos numéricos" />
							<small id="cedulaError" class="text-danger" style="display:none;">Cédula incorrecta</small>
							<small th:if="${#fields.hasErrors('cedula')}" class="text-danger" th:errors="*{cedula}"></small>
						</div>

						<div class="form-group">
							<label for="nombres">Nombres</label> <input type="text"
								th:field="*{nombres}" class="form-control" id="nombres" required maxlength="120"
								pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+(?:\s+[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+)*"
								title="Ingrese únicamente letras y espacios" />
							<small th:if="${#fields.hasErrors('nombres')}" class="text-danger" th:errors="*{nombres}"></small>
						</div>

						<div class="form-group">
							<label for="apellidos">Apellidos</label> <input type="text"
								th:field="*{apellidos}" class="form-control" id="apellidos" required maxlength="120"
								pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+(?:\s+[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+)*"
								title="Ingrese únicamente letras y espacios" />
							<small th:if="${#fields.hasErrors('apellidos')}" class="text-danger" th:errors="*{apellidos}"></small>
						</div>

						<div class="form-group">
							<label for="direccion">Dirección</label> <input type="text"
								th:field="*{direccion}" class="form-control" required maxlength="250" />
							<small th:if="${#fields.hasErrors('direccion')}" class="text-danger" th:errors="*{direccion}"></small>
						</div>

						<div class="form-group">
							<label for="telefono">Teléfono</label> <input type="text"
								th:field="*{telefono}" class="form-control" id="telefono" required
								inputmode="numeric" maxlength="20" pattern="[0-9]{7,20}"
								title="Ingrese únicamente entre 7 y 20 números" />
							<small th:if="${#fields.hasErrors('telefono')}" class="text-danger" th:errors="*{telefono}"></small>
						</div>

						<div class="form-group">
							<label for="correo">Correo (opcional)</label> <input type="email"
								th:field="*{correo}" class="form-control" />
							<small th:if="${#fields.hasErrors('correo')}" class="text-danger" th:errors="*{correo}"></small>
						</div>

						<div class="form-group">
							<label for="fechaNacimiento">Fecha de Nacimiento</label> <input
								type="date"
								id="fechaNacimiento"
								name="fechaNacimiento"
								th:value="${paciente.fechaNacimiento != null ? paciente.fechaNacimiento.toString() : ''}"
								th:max="${fechaMaximaNacimiento}"
								class="form-control"
								required />
							<small class="form-text text-muted">El paciente debe tener al menos 5 años.</small>
							<small th:if="${#fields.hasErrors('fechaNacimiento')}" class="text-danger" th:errors="*{fechaNacimiento}"></small>
						</div>

						<div class="form-group form-check">
							<input type="checkbox" th:field="*{activo}"
								class="form-check-input" id="activo" /> <label
								class="form-check-label" for="activo">Activo</label>
						</div>

						<button type="submit" class="btn" th:classappend="${modoEdicion} ? ' btn-primary' : ' btn-success'"
							th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'">Guardar</button>
						<a th:href="@{/paciente}" class="btn btn-secondary">Cancelar</a>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- Validación en tiempo real con JavaScript -->
	<div layout:fragment="scripts">
	<script>
		(function() {
			const cedulaInput = document.getElementById("cedula");
			const cedulaError = document.getElementById("cedulaError");

			if (!cedulaInput) {
				return;
			}

			const mostrarError = function(mostrar) {
				if (!cedulaError) {
					return;
				}
				cedulaError.style.display = mostrar ? "block" : "none";
				cedulaInput.classList.toggle("is-invalid", mostrar);
			};

			const esCedulaValida = function(cedula) {
				if (!/^\d{10}$/.test(cedula)) {
					return false;
				}

				const provincia = parseInt(cedula.substring(0, 2), 10);
				if (provincia < 1 || provincia > 24) {
					return false;
				}

				const tercerDigito = parseInt(cedula.charAt(2), 10);
				if (tercerDigito >= 6) {
					return false;
				}

				let suma = 0;
				for (let i = 0; i < 9; i++) {
					let digito = parseInt(cedula.charAt(i), 10);
					if (i % 2 === 0) {
						digito *= 2;
						if (digito > 9) {
							digito -= 9;
						}
					}
					suma += digito;
				}

				const verificadorEsperado = (10 - (suma % 10)) % 10;
				const verificadorReal = parseInt(cedula.charAt(9), 10);
				return verificadorEsperado === verificadorReal;
			};

			cedulaInput.addEventListener("input", function() {
				this.value = this.value.replace(/\D/g, "").substring(0, 10);
				const valor = this.value;

				let invalida = false;
				if (valor.length >= 2) {
					const provincia = parseInt(valor.substring(0, 2), 10);
					if (Number.isNaN(provincia) || provincia < 1 || provincia > 24) {
						invalida = true;
					}
				}

				if (!invalida && valor.length >= 3) {
					const tercerDigito = parseInt(valor.charAt(2), 10);
					if (Number.isNaN(tercerDigito) || tercerDigito >= 6) {
						invalida = true;
					}
				}

				if (!invalida && valor.length === 10) {
					invalida = !esCedulaValida(valor);
				}

				if (!invalida && valor.length > 0 && valor.length < 10) {
					invalida = true;
				}

				mostrarError(invalida);
				this.setCustomValidity(invalida ? "Cédula incorrecta" : "");
			});
			["nombres", "apellidos"].forEach(function(campoId) {
				document.getElementById(campoId).addEventListener("input", function() {
					this.value = this.value
						.replace(/[^\p{L}\s]/gu, "")
						.replace(/^\s+/, "")
						.replace(/\s{2,}/g, " ");
				});
			});

			document.getElementById("telefono").addEventListener("input", function() {
				this.value = this.value.replace(/\D/g, "").substring(0, 20);
			});
		})();
	</script>
	</div>

</body>
</html>
