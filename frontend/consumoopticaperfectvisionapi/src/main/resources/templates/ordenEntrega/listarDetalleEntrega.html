<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">
<head>
    <meta charset="UTF-8">
    <title>Perfect Vision - Detalles de Entrega</title>
</head>
<body>
<div layout:fragment="contenidopaginas">
    <div class="container-fluid">
        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h5 class="m-0 font-weight-bold text-primary"
                    th:text="${'Detalles de la Entrega #'+idEntrega}">Detalles de Entrega</h5>
                <div>
                    <a th:if="${entregaRecibida == null or !entregaRecibida}"
                       th:href="@{/ordenes-entrega/{idEntrega}/detalles/nuevo(idEntrega=${idEntrega})}"
                       class="btn btn-success btn-sm">Nuevo Detalle</a>
                    <a th:if="${entregaRecibida != null and entregaRecibida}"
                       href="#"
                       class="btn btn-secondary btn-sm disabled"
                       aria-disabled="true"
                       title="No disponible: la entrega ya fue confirmada">
                        Nuevo Detalle
                    </a>
                    <a th:href="@{/ordenes-entrega}" class="btn btn-secondary btn-sm">Volver a Entregas</a>
                </div>
            </div>
            <div class="card-body">
                <div th:if="${success}" class="alert alert-success" role="alert">
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}"></span>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered" width="100%" cellspacing="0">
                        <thead>
                        <tr>
                            <th>ID Detalle</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Estado</th>
                            <th>Fecha Registro</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(listadetalles)}">
                            <td colspan="6" class="text-center">No existen detalles para esta entrega.</td>
                        </tr>
                        <tr th:each="detalle : ${listadetalles}">
                            <td th:text="${detalle.idDetEntrega}"></td>
                            <td th:text="${productosPorId[detalle.idProducto] != null ? productosPorId[detalle.idProducto] : 'Producto #' + detalle.idProducto}"></td>
                            <td th:text="${detalle.cantidad}"></td>
                            <td th:text="${detalle.estado ? 'Activo' : 'Inactivo'}"></td>
                            <td th:text="${detalle.fechaRegistro}"></td>
                            <td>
                                          <a th:if="${entregaRecibida == null or !entregaRecibida}"
                                              th:href="@{/ordenes-entrega/{idEntrega}/detalles/editar/{idDetEntrega}(idEntrega=${idEntrega},idDetEntrega=${detalle.idDetEntrega})}"
                                   class="btn btn-warning btn-sm mr-1"
                                   title="Editar"
                                   aria-label="Editar"><i class="fas fa-edit"></i></a>
                                          <a th:if="${entregaRecibida != null and entregaRecibida}"
                                              href="#"
                                              class="btn btn-secondary btn-sm mr-1 disabled"
                                              title="Edición bloqueada por entrega confirmada"
                                              aria-label="Edición bloqueada"
                                              aria-disabled="true"><i class="fas fa-edit"></i></a>
                                          <a th:if="${entregaRecibida == null or !entregaRecibida}"
                                              th:href="@{/ordenes-entrega/{idEntrega}/detalles/eliminar/{idDetEntrega}(idEntrega=${idEntrega},idDetEntrega=${detalle.idDetEntrega})}"
                                   class="btn btn-danger btn-sm"
                                   title="Eliminar"
                                   aria-label="Eliminar"
                                   onclick="return confirm('¿Desea eliminar este detalle de entrega?');"><i class="fas fa-trash"></i></a>
                                          <a th:if="${entregaRecibida != null and entregaRecibida}"
                                              href="#"
                                              class="btn btn-secondary btn-sm disabled"
                                              title="Eliminación bloqueada por entrega confirmada"
                                              aria-label="Eliminación bloqueada"
                                              aria-disabled="true"><i class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
