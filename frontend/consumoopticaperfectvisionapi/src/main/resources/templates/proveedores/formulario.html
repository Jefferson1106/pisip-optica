<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">

<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicion} ? 'Actualizar Proveedor - Perfect Vision' : 'Nuevo Proveedor - Perfect Vision'">Proveedor - Perfect Vision</title>
</head>

<body>
<div layout:fragment="contenidopaginas">
    <div class="container-fluid">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h5 class="m-0 font-weight-bold text-primary"
                    th:text="${modoEdicion} ? 'Actualizar Proveedor' : 'Registrar Nuevo Proveedor'">Registrar Nuevo Proveedor</h5>
            </div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post">
                    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">Revise los campos del formulario.</div>
                    <input type="hidden" th:field="*{idProveedor}">

                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                        <small th:if="${#fields.hasErrors('nombre')}" class="text-danger" th:errors="*{nombre}"></small>
                    </div>

                    <div class="form-group">
                        <label for="identificacion">Identificación</label>
                        <input type="text" class="form-control" id="identificacion" th:field="*{identificacion}"
                               required inputmode="numeric" minlength="10" maxlength="13"
                               pattern="[0-9]{10}|[0-9]{13}"
                               oninput="this.value = this.value.replace(/\D/g, '').slice(0, 13)"
                               title="Ingrese una cédula de 10 dígitos o un RUC de 13 dígitos">
                        <small class="form-text text-muted">Cédula de 10 dígitos o RUC de 13 dígitos.</small>
                        <small th:if="${#fields.hasErrors('identificacion')}" class="text-danger" th:errors="*{identificacion}"></small>
                        <small th:if="${#fields.hasErrors('identificacionEcuatorianaValida')}" class="text-danger d-block"
                               th:errors="*{identificacionEcuatorianaValida}"></small>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo</label>
                        <input type="email" class="form-control" id="correo" th:field="*{correo}" required>
                        <small th:if="${#fields.hasErrors('correo')}" class="text-danger" th:errors="*{correo}"></small>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="text" class="form-control" id="telefono" th:field="*{telefono}"
                               required inputmode="numeric" minlength="10" maxlength="10" pattern="[0-9]{10}"
                               autocomplete="tel" oninput="this.value = this.value.replace(/\D/g, '').slice(0, 10)"
                               title="Ingrese un teléfono de exactamente 10 números">
                        <small class="form-text text-muted">Ingrese exactamente 10 números.</small>
                        <small th:if="${#fields.hasErrors('telefono')}" class="text-danger" th:errors="*{telefono}"></small>
                    </div>

                    <div class="form-group">
                        <label for="direccion">Dirección</label>
                        <input type="text" class="form-control" id="direccion" th:field="*{direccion}">
                        <small th:if="${#fields.hasErrors('direccion')}" class="text-danger" th:errors="*{direccion}"></small>
                    </div>

                    <div class="form-group form-check">
                        <input type="checkbox" class="form-check-input" id="estado" th:field="*{estado}">
                        <label class="form-check-label" for="estado">Activo</label>
                    </div>

                    <button type="submit" class="btn" th:classappend="${modoEdicion} ? ' btn-primary' : ' btn-success'"
                            th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'">Guardar</button>
                    <a th:href="@{/proveedores}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
