<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">
<body><div layout:fragment="contenidopaginas">
<div class="card shadow mb-4">
 <div class="card-header py-3 d-flex justify-content-between align-items-center">
  <h5 class="m-0 font-weight-bold text-primary">Productos</h5>
  <a th:href="@{/productos/nuevo}" class="btn btn-success btn-sm">Nuevo producto</a>
 </div>
 <div class="card-body"><div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div class="table-responsive"><table class="table table-bordered">
   <thead><tr><th>Código</th><th>Producto</th><th>Proveedor</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr></thead>
   <tbody><tr th:each="p : ${productos}">
    <td th:text="${p.codigo}"></td><td th:text="${p.nombre}"></td><td th:text="${p.proveedorNombre}"></td>
    <td th:text="${'$ ' + #numbers.formatDecimal(p.precio, 1, 2)}"></td><td th:text="${p.estado ? 'Activo' : 'Inactivo'}"></td>
    <td><a th:href="@{/productos/editar/{id}(id=${p.idProducto})}" class="btn btn-primary btn-sm">Editar</a></td>
   </tr></tbody>
  </table></div>
 </div>
</div></div></body></html>
