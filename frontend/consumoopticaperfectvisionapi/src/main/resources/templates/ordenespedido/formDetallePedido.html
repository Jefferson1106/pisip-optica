<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">
<head>
    <meta charset="UTF-8">
    <title>Perfect Vision - Formulario Detalle Pedido</title>
</head>
<body>
<div layout:fragment="contenidopaginas">
    <div class="container-fluid">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h5 class="m-0 font-weight-bold text-primary"
                    th:text="${modoEdicion} ? 'Editar Detalle Pedido' : 'Nuevo Detalle Pedido'">Detalle Pedido</h5>
            </div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="${modoEdicion} ? @{/ordenespedido/{idPedido}/detalles/actualizar/{idDetOrden}(idPedido=${idPedido},idDetOrden=${idDetOrden})} : @{/ordenespedido/{idPedido}/detalles/guardar(idPedido=${idPedido})}"
                      th:object="${detalleOrden}" method="post">
                    <input type="hidden" th:field="*{idPedido}" />

                    <div class="form-row">
                        <div class="form-group col-md-8">
                            <label>Producto</label>
                            <select th:field="*{idProducto}" class="form-control" required>
                                <option value="">Seleccione...</option>
                                <option th:each="item : ${listaproductos}"
                                        th:value="${item.idProducto}"
                                        th:data-precio="${item.precio}"
                                        th:text="${item.codigo + ' - ' + item.nombre + ' | ' + item.proveedorNombre}"></option>
                            </select>
                        </div>
                        <div class="form-group col-md-4">
                            <label>Cantidad</label>
                            <input type="number" min="1" th:field="*{cantidad}" class="form-control" required />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Precio Unitario</label>
                            <input type="number" step="0.01" th:field="*{precioUnitario}" class="form-control" readonly />
                        </div>
                        <div class="form-group col-md-6">
                            <label>Total</label>
                            <input type="number" id="totalDetalle" class="form-control" step="0.01" readonly />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Fecha Registro</label>
                        <input type="datetime-local" name="fechaRegistro"
                               th:value="${detalleOrden.fechaRegistro != null ? #temporals.format(detalleOrden.fechaRegistro, 'yyyy-MM-dd''T''HH:mm') : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd''T''HH:mm')}"
                               class="form-control" required />
                    </div>

                    <button type="submit" class="btn" th:classappend="${modoEdicion} ? ' btn-primary' : ' btn-success'"
                            th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'">Guardar</button>
                    <a th:href="@{/ordenespedido/{idPedido}/detalles(idPedido=${idPedido})}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const cantidad = document.getElementById('cantidad');
    const producto = document.getElementById('idProducto');
    const precio = document.getElementById('precioUnitario');
    const total = document.getElementById('totalDetalle');

    const calcularTotal = function () {
        const cant = parseFloat(cantidad && cantidad.value ? cantidad.value : '0');
        const pre = parseFloat(precio && precio.value ? precio.value : '0');
        total.value = (cant * pre).toFixed(2);
    };

    const cargarPrecio = function () {
        const opcion = producto.options[producto.selectedIndex];
        precio.value = opcion && opcion.dataset.precio ? opcion.dataset.precio : '';
        calcularTotal();
    };

    if (cantidad && producto && precio && total) {
        cantidad.addEventListener('input', calcularTotal);
        producto.addEventListener('change', cargarPrecio);
        if (producto.value) {
            cargarPrecio();
        }
        calcularTotal();
    }
});
</script>
</body>
</html>
