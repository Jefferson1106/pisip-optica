<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="/plantilla/plantillaui">

<head>
<meta charset="UTF-8">
<title>Perfect Vision - Certificados</title>
</head>

<body>
    <div layout:fragment="contenidopaginas">
        <div class="container-fluid">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h5 class="m-0 font-weight-bold text-primary">Certificados Medicos</h5>
                </div>
                <div class="card-body">
                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/certificados}" method="get" class="form-inline mb-3">
                        <label for="idPaciente" class="mr-2">Paciente</label>
                        <select id="idPaciente" name="idPaciente" class="form-control mr-2">
                            <option value="">Todos</option>
                            <option th:each="paciente : ${listapacientes}"
                                th:value="${paciente.idPaciente}"
                                th:text="${paciente.nombres + ' ' + paciente.apellidos}"
                                th:selected="${idPacienteSeleccionado != null and idPacienteSeleccionado == paciente.idPaciente}">
                            </option>
                        </select>
                        <label for="cedula" class="mr-2">Cedula</label>
                        <input id="cedula" name="cedula" type="text" class="form-control mr-2"
                               maxlength="10" placeholder="Buscar por cedula"
                               th:value="${cedulaFiltro}" />
                        <button type="submit" class="btn btn-info btn-sm mr-2">Filtrar</button>
                        <a th:href="@{/certificados}" class="btn btn-secondary btn-sm">Limpiar</a>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                            <thead>
                                <tr>
                                    <th>N°</th>
                                    <th>Codigo</th>
                                    <th>Nombres</th>
                                    <th>Apellidos</th>
                                    <th>Cedula</th>
                                    <th>Fecha Emision</th>
                                    <th>Diagnostico</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(listacertificados)}">
                                    <td colspan="9" class="text-center">No hay examenes disponibles para generar certificados.</td>
                                </tr>
                                <tr th:each="certificado, iterStat : ${listacertificados}">
                                    <td th:text="${iterStat.count}"></td>
                                    <td th:text="${'CERT-' + certificado.idExamen}"></td>
                                    <td th:text="${nombresPorPaciente[certificado.idPaciente] != null ? nombresPorPaciente[certificado.idPaciente] : '-'}"></td>
                                    <td th:text="${apellidosPorPaciente[certificado.idPaciente] != null ? apellidosPorPaciente[certificado.idPaciente] : '-'}"></td>
                                    <td th:text="${cedulasPorPaciente[certificado.idPaciente] != null ? cedulasPorPaciente[certificado.idPaciente] : '-'}"></td>
                                    <td th:text="${certificado.fechaExamen}"></td>
                                    <td th:text="${certificado.observaciones != null and !#strings.isEmpty(certificado.observaciones) ? certificado.observaciones : 'Sin observaciones'}"></td>
                                    <td th:text="${certificado.estado ? 'Emitido' : 'Revision'}"></td>
                                    <td>
                                        <a th:href="@{/certificados/ver/{idExamen}(idExamen=${certificado.idExamen})}"
                                            class="btn btn-info btn-sm mr-1"
                                            title="Ver certificado"
                                            aria-label="Ver certificado"><i class="fas fa-eye"></i></a>
                                        <a th:href="@{/certificados/pdf/{idExamen}(idExamen=${certificado.idExamen})}"
                                            class="btn btn-primary btn-sm"
                                            title="Descargar PDF"
                                            aria-label="Descargar PDF"><i class="fas fa-file-pdf"></i></a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
