<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">
<head>
    <meta charset="UTF-8">
    <title>Perfect Vision - Formulario Detalle Pedido</title>
</head>
<body>
<div layout:fragment="contenidopaginas">
    <div class="container-fluid">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h5 class="m-0 font-weight-bold text-primary"
                    th:text="${modoEdicion} ? 'Editar Detalle Pedido' : 'Nuevo Detalle Pedido'">Detalle Pedido</h5>
            </div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="${modoEdicion} ? @{/ordenespedido/{idPedido}/detalles/actualizar/{idDetOrden}(idPedido=${idPedido},idDetOrden=${idDetOrden})} : @{/ordenespedido/{idPedido}/detalles/guardar(idPedido=${idPedido})}"
                      th:object="${detalleOrden}" method="post">
                    <input type="hidden" th:field="*{idPedido}" />

                    <div class="form-row">
                        <div class="form-group col-md-8">
                            <label for="productoBuscador">Producto</label>
                            <input type="hidden" th:field="*{idProducto}" />
                            <input type="text" id="productoBuscador" class="form-control"
                                   list="productosDisponibles" placeholder="Digite el código, producto o proveedor"
                                   autocomplete="off" required />
                            <datalist id="productosDisponibles">
                                <option th:each="item : ${listaproductos}"
                                        th:value="${item.codigo + ' - ' + item.nombre + ' | ' + item.proveedorNombre}"
                                        th:data-id="${item.idProducto}"
                                        th:data-seleccionado="${item.idProducto == detalleOrden.idProducto}"></option>
                            </datalist>
                            <small class="form-text text-muted">Escriba para buscar y seleccione un producto de la lista.</small>
                        </div>
                        <div class="form-group col-md-4">
                            <label>Cantidad</label>
                            <input type="number" min="1" th:field="*{cantidad}" class="form-control" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Fecha Registro</label>
                        <input type="datetime-local" name="fechaRegistro"
                               th:value="${detalleOrden.fechaRegistro != null ? #temporals.format(detalleOrden.fechaRegistro, 'yyyy-MM-dd''T''HH:mm') : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd''T''HH:mm')}"
                               class="form-control" required />
                    </div>

                    <button type="submit" class="btn" th:classappend="${modoEdicion} ? ' btn-primary' : ' btn-success'"
                            th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'">Guardar</button>
                    <a th:href="@{/ordenespedido/{idPedido}/detalles(idPedido=${idPedido})}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="scripts">
<script>
document.addEventListener('DOMContentLoaded', function () {
    const buscador = document.getElementById('productoBuscador');
    const productoId = document.getElementById('idProducto');
    const opciones = Array.from(document.querySelectorAll('#productosDisponibles option'));

    if (!buscador || !productoId) {
        return;
    }

    const sincronizarProducto = function () {
        const opcion = opciones.find(function (item) {
            return item.value === buscador.value;
        });
        productoId.value = opcion ? opcion.dataset.id : '';
        buscador.setCustomValidity(opcion ? '' : 'Seleccione un producto existente de la lista');
    };

    const seleccionada = opciones.find(function (item) {
        return item.dataset.seleccionado === 'true';
    });
    if (seleccionada) {
        buscador.value = seleccionada.value;
    }

    buscador.addEventListener('input', sincronizarProducto);
    buscador.addEventListener('change', sincronizarProducto);
    buscador.form.addEventListener('submit', sincronizarProducto);
});
</script>
</div>
</body>
</html>
