<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">
<body><div layout:fragment="contenidopaginas">
<div class="card shadow mb-4"><div class="card-header py-3">
 <h5 class="m-0 font-weight-bold text-primary" th:text="${modoEdicion ? 'Editar proveedor' : 'Nuevo proveedor'}"></h5>
</div><div class="card-body">
 <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
 <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post">
  <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
   <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
  </div>
  <input type="hidden" th:field="*{idProveedor}">
  <div class="form-row">
   <div class="form-group col-md-6"><label>Nombre</label>
    <input class="form-control" th:field="*{nombre}" required>
    <small class="text-danger" th:errors="*{nombre}"></small></div>
   <div class="form-group col-md-6"><label>Identificación</label>
    <input class="form-control" th:field="*{identificacion}" required inputmode="numeric"
           minlength="10" maxlength="13" pattern="[0-9]{10}|[0-9]{13}"
           title="Ingrese una cédula de 10 dígitos o un RUC de 13 dígitos">
    <small class="form-text text-muted">Cédula de 10 dígitos o RUC de 13 dígitos.</small>
    <small class="text-danger" th:errors="*{identificacion}"></small></div>
  </div>
  <div class="form-row">
   <div class="form-group col-md-6"><label>Correo</label>
    <input type="email" class="form-control" th:field="*{correo}" required>
    <small class="text-danger" th:errors="*{correo}"></small></div>
   <div class="form-group col-md-6"><label>Teléfono</label>
    <input class="form-control" th:field="*{telefono}" required inputmode="numeric"
           pattern="[0-9]+" title="Ingrese únicamente números">
    <small class="text-danger" th:errors="*{telefono}"></small></div>
  </div>
  <div class="form-group"><label>Dirección</label><input class="form-control" th:field="*{direccion}"></div>
  <div class="form-group"><label>Estado</label><select class="form-control" th:field="*{estado}">
   <option th:value="true">Activo</option><option th:value="false">Inactivo</option></select></div>
  <button class="btn btn-success" type="submit">Guardar</button><a th:href="@{/proveedores}" class="btn btn-secondary">Cancelar</a>
 </form>
</div></div></div></body></html>
