<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">
<body><div layout:fragment="contenidopaginas">
<div class="card shadow mb-4"><div class="card-header py-3">
 <h5 class="m-0 font-weight-bold text-primary" th:text="${modoEdicion ? 'Editar producto' : 'Nuevo producto'}"></h5>
</div><div class="card-body">
 <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
 <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
  <input type="hidden" th:field="*{idProducto}">
  <div class="form-row">
   <div class="form-group col-md-4"><label>Código</label><input class="form-control" th:field="*{codigo}" required></div>
   <div class="form-group col-md-8"><label>Nombre</label><input class="form-control" th:field="*{nombre}" required></div>
  </div>
  <div class="form-group"><label>Descripción</label><textarea class="form-control" th:field="*{descripcion}"></textarea></div>
  <div class="form-row">
   <div class="form-group col-md-5"><label>Proveedor</label><select class="form-control" th:field="*{idProveedor}" required>
    <option value="">Seleccione...</option><option th:each="p : ${proveedores}" th:value="${p.idProveedor}" th:text="${p.nombre}"></option>
   </select></div>
   <div class="form-group col-md-4"><label>Precio</label><input type="number" min="0" step="0.01" class="form-control" th:field="*{precio}" required></div>
   <div class="form-group col-md-3"><label>Estado</label><select class="form-control" th:field="*{estado}">
    <option th:value="true">Activo</option><option th:value="false">Inactivo</option></select></div>
  </div>
  <button class="btn btn-success" type="submit">Guardar</button><a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
 </form>
</div></div></div></body></html>
