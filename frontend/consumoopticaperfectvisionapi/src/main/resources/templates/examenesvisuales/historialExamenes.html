<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">
<head>
    <meta charset="UTF-8">
    <title>Perfect Vision - Historial de Examenes</title>
</head>
<body>
<div layout:fragment="contenidopaginas">
    <div class="container-fluid">
        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h5 class="m-0 font-weight-bold text-primary">Historial de Examenes por Paciente</h5>
                <a th:href="@{/examenes-visuales}" class="btn btn-secondary btn-sm">Volver a Examenes</a>
            </div>
            <div class="card-body">
                <form th:action="@{/examenes-visuales/historial}" method="get" class="form-inline mb-3">
                    <label for="idPaciente" class="mr-2">Paciente</label>
                    <select id="idPaciente" name="idPaciente" class="form-control mr-2">
                        <option value="">Todos</option>
                        <option th:each="paciente : ${listapacientes}"
                                th:value="${paciente.idPaciente}"
                                th:text="${paciente.nombres + ' ' + paciente.apellidos}"
                                th:selected="${idPacienteSeleccionado != null and idPacienteSeleccionado == paciente.idPaciente}">
                        </option>
                    </select>
                    <label for="cedula" class="mr-2">Cédula</label>
                    <input id="cedula" name="cedula" type="text" class="form-control mr-2"
                           maxlength="10" placeholder="Buscar por cédula"
                           th:value="${cedulaFiltro}" />
                    <button type="submit" class="btn btn-primary btn-sm mr-2">Filtrar</button>
                    <a th:href="@{/examenes-visuales/historial}" class="btn btn-light btn-sm">Limpiar</a>
                </form>

                <div class="table-responsive">
                    <table class="table table-bordered" width="100%" cellspacing="0">
                        <thead>
                        <tr>
                            <th>N°</th>
                            <th>Paciente</th>
                            <th>Cédula</th>
                            <th>Fecha Examen</th>
                            <th>Observaciones</th>
                            <th>Estado</th>
                            <th>Detalles</th>
                            <th>Certificado</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(listaexamenes)}">
                            <td colspan="8" class="text-center">No existen examenes para el filtro seleccionado.</td>
                        </tr>
                        <tr th:each="examen, iterStat : ${listaexamenes}">
                            <td th:text="${iterStat.count}"></td>
                            <td th:text="${examen.pacienteNombre}"></td>
                            <td th:text="${cedulasPorPaciente[examen.idPaciente] != null ? cedulasPorPaciente[examen.idPaciente] : '-'}"></td>
                            <td th:text="${examen.fechaExamen}"></td>
                            <td th:text="${examen.observaciones}"></td>
                            <td th:text="${examen.estado ? 'Activo' : 'Inactivo'}"></td>
                            <td>
                                <a th:href="@{/examenes-visuales/{id}/detalles(id=${examen.idExamen})}"
                                   class="btn btn-outline-info btn-sm"
                                   title="Ver detalles"
                                   aria-label="Ver detalles"><i class="fas fa-eye"></i></a>
                            </td>
                            <td>
                                <a th:href="@{/certificados/ver/{idExamen}(idExamen=${examen.idExamen})}"
                                   class="btn btn-outline-primary btn-sm"
                                   title="Ver certificado"
                                   aria-label="Ver certificado"><i class="fas fa-file-medical"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
