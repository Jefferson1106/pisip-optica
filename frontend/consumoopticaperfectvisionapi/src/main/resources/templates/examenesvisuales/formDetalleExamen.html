<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">
<head>
    <meta charset="UTF-8">
    <title>Perfect Vision - Formulario Detalle Examen</title>
</head>
<body>
<div layout:fragment="contenidopaginas">
    <div class="container-fluid">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h5 class="m-0 font-weight-bold text-primary"
                    th:text="${modoEdicion} ? 'Editar Detalle Examen' : 'Nuevo Detalle Examen'">Detalle Examen</h5>
            </div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="${modoEdicion} ? @{/examenes-visuales/{idExamen}/detalles/actualizar/{idDetExamen}(idExamen=${idExamen},idDetExamen=${idDetExamen})} : @{/examenes-visuales/{idExamen}/detalles/guardar(idExamen=${idExamen})}"
                      th:object="${detalleExamen}" method="post">
                    <input type="hidden" th:field="*{examenVisual.idExamen}" />

                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label>Esfera Dist. OD</label>
                            <input type="number" step="0.01" th:field="*{esferaDistanciaOd}" class="form-control" />
                        </div>
                        <div class="form-group col-md-4">
                            <label>Cilindro Dist. OD</label>
                            <input type="number" step="0.01" th:field="*{cilindroDistanciaOd}" class="form-control" />
                        </div>
                        <div class="form-group col-md-4">
                            <label>Eje Dist. OD</label>
                            <input type="number" th:field="*{ejeDistanciaOd}" class="form-control" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label>Esfera Dist. OI</label>
                            <input type="number" step="0.01" th:field="*{esferaDistanciaOi}" class="form-control" />
                        </div>
                        <div class="form-group col-md-4">
                            <label>Cilindro Dist. OI</label>
                            <input type="number" step="0.01" th:field="*{cilindroDistanciaOi}" class="form-control" />
                        </div>
                        <div class="form-group col-md-4">
                            <label>Eje Dist. OI</label>
                            <input type="number" th:field="*{ejeDistanciaOi}" class="form-control" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label>Adicion OD</label>
                            <input type="number" step="0.01" th:field="*{adicionOd}" class="form-control" />
                        </div>
                        <div class="form-group col-md-4">
                            <label>Adicion OI</label>
                            <input type="number" step="0.01" th:field="*{adicionOi}" class="form-control" />
                        </div>
                        <div class="form-group col-md-4">
                            <label>Distancia Pupilar</label>
                            <input type="number" step="0.01" th:field="*{distanciaPupilar}" class="form-control" />
                        </div>
                    </div>

                    <button type="submit" class="btn" th:classappend="${modoEdicion} ? ' btn-primary' : ' btn-success'"
                            th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'">Guardar</button>
                    <a th:href="@{/examenes-visuales/{idExamen}/detalles(idExamen=${idExamen})}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
